<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Let YouTube receive the site's HTTPS referrer -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Chaos Projector Player</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #error {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <iframe
    id="player"
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <div id="error">
    <div>
      <h2>Chaos Projector</h2>
      <p>No YouTube video was supplied.</p>
    </div>
  </div>

  <script>
    function getVideoId() {
      const params = new URLSearchParams(window.location.search);

      let id =
        params.get("video") ||
        params.get("v") ||
        params.get("videoId");

      if (id) {
        return id.trim();
      }

      const hash = window.location.hash.replace("#", "").trim();

      if (hash) {
        return hash;
      }

      return null;
    }

    function loadVideo() {
      const videoId = getVideoId();

      if (!videoId) {
        document.getElementById("error").style.display = "flex";
        return;
      }

      const cleanId = videoId.replace(/[^a-zA-Z0-9_-]/g, "");

      if (!cleanId) {
        document.getElementById("error").style.display = "flex";
        return;
      }

      const player = document.getElementById("player");

      const url =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(cleanId) +
        "?autoplay=1" +
        "&controls=1" +
        "&playsinline=1" +
        "&rel=0" +
        "&modestbranding=1" +
        "&enablejsapi=1" +
        "&origin=" +
        encodeURIComponent(window.location.origin) +
        "&widget_referrer=" +
        encodeURIComponent(window.location.origin);

      player.src = url;
    }

    loadVideo();
  </script>

</body>
</html>
